<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrevenApp - Categorías</title>
    <style>
        :root {
            --rosa-pastel: #f8ecee;
            --rosa-medio: #f3d1d9;
            --lila-suave: #e6e6fa;
            --lila-medio: #d8b4e2;
            --lila-oscuro: #8b6b93;
            --blanco: #ffffff;
            --texto-oscuro: #4a3e4e;
            --borde-suave: #e8dbe4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--rosa-pastel);
            color: var(--texto-oscuro);
            margin: 0;
            padding: 40px 20px;
        }

        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--blanco);
            border: 2px solid var(--lila-medio);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--rosa-medio);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--lila-oscuro);
            margin: 0;
            font-size: 1.8rem;
        }

        .tabla-contenedor {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--borde-suave);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--blanco);
        }

        th {
            background-color: var(--lila-suave);
            color: var(--texto-oscuro);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--lila-medio);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--borde-suave);
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: var(--rosa-pastel);
        }

        .sin-datos {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <h1>Categorías</h1>
        </div>
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cat in categorias %}
                    <tr>
                        <td>{{ cat.id }}</td>
                        <td>{{ cat.nombre }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="sin-datos">No hay categorías registradas.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
