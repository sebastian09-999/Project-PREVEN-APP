<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de registro de usuarios de PrevenApp">
    <title>Registro de Usuario - PrevenApp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2f5 0%, #dbe3ea 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-card {
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 620px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-card:hover {
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
        }

        .form-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .form-header h2 {
            color: #2c3e50;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-header p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field-full {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 0.88rem;
        }

        label .required {
            color: #e74c3c;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #dcdfe6;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #2c3e50;
            background-color: #fdfdfd;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:hover, select:hover {
            border-color: #bdc3c7;
        }

        input:focus, select:focus {
            border-color: #3498db;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.18);
        }

        /* Secciones dinámicas por rol */
        .seccion-rol {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            padding: 16px;
            background-color: #f8fafc;
            border: 1.5px dashed #cbd5e1;
            border-radius: 12px;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .seccion-rol.active {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            color: #2c3e50;
            font-size: 1rem;
            font-weight: 700;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin-bottom: 4px;
        }

        /* Botón con microinteracción */
        button[type="submit"] {
            padding: 14px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
            transition: all 0.25s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #2980b9 0%, #1f618d 100%);
            box-shadow: 0 6px 18px rgba(52, 152, 219, 0.45);
            transform: translateY(-1px);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.2);
        }

        @media (max-width: 540px) {
            .form-grid, .seccion-rol {
                grid-template-columns: 1fr;
            }

            .field-full, button[type="submit"] {
                grid-column: span 1;
            }

            .form-card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>

    <main class="form-card">
        <header class="form-header">
            <h2>Registro de Usuario</h2>
            <p>Ingresa la información requerida para crear tu cuenta</p>
        </header>

        <form method="POST" class="form-grid">
            {% csrf_token %}

            <!-- Selector de Rol -->
            <div class="form-group field-full">
                <label for="select-rol">Rol de Usuario <span class="required">*</span></label>
                <select id="select-rol" name="rol" onchange="cambiarCamposPorRol()" required>
                    <option value="" disabled selected>-- Selecciona un rol --</option>
                    {% for r in roles %}
                        <option value="{{ r.idRol }}" data-nombre="{{ r.nombre }}">{{ r.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- CAMPOS COMUNES -->
            <div class="form-group">
                <label for="nombres">Nombres <span class="required">*</span></label>
                <input type="text" id="nombres" name="nombres" placeholder="Ej. Carlos Eduardo" required>
            </div>

            <div class="form-group">
                <label for="apellidos">Apellidos <span class="required">*</span></label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Ej. Gómez Ruiz" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico <span class="required">*</span></label>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono <span class="required">*</span></label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej. 3001234567" required>
            </div>

            <div class="form-group">
                <label for="edad">Edad <span class="required">*</span></label>
                <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Ej. 25" required>
            </div>

            <div class="form-group">
                <label for="sexo">Sexo <span class="required">*</span></label>
                <select id="sexo" name="sexo" required>
                    <option value="" disabled selected>Seleccione...</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-group field-full">
                <label for="contrasena">Contraseña <span class="required">*</span></label>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
            </div>

            <!-- SECCIÓN SOLO PACIENTE -->
            <div id="seccion-paciente" class="seccion-rol field-full" style="display: none;">
                <div class="section-title field-full">Información Médica del Paciente</div>
                
                <div class="form-group">
                    <label for="eps">EPS <span class="required">*</span></label>
                    <input type="text" id="eps" name="eps" placeholder="Ej. Sura, Sanitas">
                </div>

                <div class="form-group">
                    <label for="rh">Grupo Sanguíneo (RH) <span class="required">*</span></label>
                    <input type="text" id="rh" name="rh" placeholder="Ej. O+, A-">
                </div>
            </div>

            <!-- SECCIÓN SOLO PROFESIONAL -->
            <div id="seccion-profesional" class="seccion-rol field-full" style="display: none;">
                <div class="section-title field-full">Información Profesional</div>
                
                <div class="form-group">
                    <label for="especialidad">Especialidad <span class="required">*</span></label>
                    <select id="especialidad" name="especialidad">
                        <option value="" disabled selected>Selecciona especialidad</option>
                        {% for esp in especialidades %}
                            <option value="{{ esp.id }}">{{ esp.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="documento_identidad">Documento de Identidad <span class="required">*</span></label>
                    <input type="text" id="documento_identidad" name="documento_identidad" placeholder="Número de documento">
                </div>

                <div class="form-group field-full">
                    <label for="credencial_profesional">Tarjeta / Credencial Profesional <span class="required">*</span></label>
                    <input type="text" id="credencial_profesional" name="credencial_profesional" placeholder="Ej. TP-123456-A">
                </div>
            </div>

            <button type="submit" class="field-full">Completar Registro</button>
        </form>
    </main>

    <script>
        function cambiarCamposPorRol() {
            const select = document.getElementById('select-rol');
            const opcionSeleccionada = select.options[select.selectedIndex];
            const nombreRol = opcionSeleccionada.getAttribute('data-nombre') 
                ? opcionSeleccionada.getAttribute('data-nombre').toLowerCase() 
                : '';

            // 1. Ocultar y deshabilitar todas las secciones dinámicas
            const secciones = document.querySelectorAll('.seccion-rol');
            secciones.forEach(seccion => {
                seccion.style.display = 'none';
                seccion.classList.remove('active');
                
                const inputs = seccion.querySelectorAll('input, select');
                inputs.forEach(input => {
                    input.disabled = true;
                    input.required = false;
                });
            });

            // 2. Activar la sección correspondiente
            if (nombreRol.includes('profesional') || nombreRol.includes('medico')) {
                activarSeccion('seccion-profesional');
            } else if (nombreRol.includes('paciente') || nombreRol.includes('usuario')) {
                activarSeccion('seccion-paciente');
            }
        }

        function activarSeccion(idSeccion) {
            const contenedor = document.getElementById(idSeccion);
            if (contenedor) {
                contenedor.style.display = 'grid';
                
                setTimeout(() => contenedor.classList.add('active'), 10);
                
                const inputs = contenedor.querySelectorAll('input, select');
                inputs.forEach(input => {
                    input.disabled = false;
                    input.required = true;
                });
            }
        }

        document.addEventListener('DOMContentLoaded', cambiarCamposPorRol);
    </script>
</body>
</html>
