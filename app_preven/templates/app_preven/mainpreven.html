<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrevenApp - Panel Principal</title>
    <style>
        :root {
            --rosa-pastel: #f8ecee;
            --rosa-medio: #f3d1d9;
            --lila-suave: #e6e6fa;
            --lila-medio: #d8b4e2;
            --lila-oscuro: #8b6b93;
            --blanco: #ffffff;
            --texto-oscuro: #4a3e4e;
            --borde-suave: #e8dbe4;
            --rojo-suave: #f4bebe;
            --rojo-texto: #a83232;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--rosa-pastel);
            color: var(--texto-oscuro);
            margin: 0;
            padding: 40px 20px;
        }

        .contenedor-principal {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--blanco);
            border: 2px solid var(--lila-medio);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--rosa-medio);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--lila-oscuro);
            margin: 0;
            font-size: 1.8rem;
        }

        .btn-crear {
            background-color: var(--lila-medio);
            color: var(--blanco);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-crear:hover {
            background-color: var(--lila-oscuro);
        }

        .tabla-contenedor {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--borde-suave);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--blanco);
        }

        th {
            background-color: var(--lila-suave);
            color: var(--texto-oscuro);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--lila-medio);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--borde-suave);
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: var(--rosa-pastel);
        }

        .acciones {
            display: flex;
            gap: 10px;
        }

        .btn-editar {
            background-color: var(--rosa-medio);
            color: var(--texto-oscuro);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-editar:hover {
            background-color: var(--lila-medio);
        }

        .btn-eliminar {
            background-color: var(--rojo-suave);
            color: var(--rojo-texto);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-eliminar:hover {
            background-color: #e8a2a2;
        }

        .sin-datos {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <div class="encabezado">
            <h1>Gestión de Pacientes</h1>
            <a href="{% url 'crear_paciente' %}" class="btn-crear">+ Registrar Nuevo Paciente</a>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Documento</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for paciente in pacientes %}
                    <tr>
                        <td>{{ paciente.nombre }}</td>
                        <td>{{ paciente.documento }}</td>
                        <td>{{ paciente.correo }}</td>
                        <td>
                            <div class="acciones">
                                <a href="{% url 'editar_paciente' paciente.pk %}" class="btn-editar">Editar</a>
                                <a href="{% url 'eliminar_paciente' paciente.pk %}" class="btn-eliminar">Eliminar</a>
                            </div>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="sin-datos">No hay pacientes registrados actualmente.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
